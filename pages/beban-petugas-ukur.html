<script src="../js/auth.js"></script>
<script src="../js/auth-guard.js"></script>
<div class="bg-white rounded-lg shadow">

  
  <div class="px-6 py-3 border-b flex items-center gap-2">
    <img src="icons/folder-plus.svg" class="w-4 h-4">
    <h2 class="text-sm font-semibold text-blue-600">
      Beban Petugas Ukur
    </h2>
  </div>

  <div class="px-6 py-5 space-y-5 text-sm text-gray-700">
    <div class="flex justify-between items-start gap-6">
      <div class="grid grid-cols-3 gap-4 flex-1">

        <div class="border rounded p-3 text-center">
          <div class="text-xs font-semibold text-gray-500">TOTAL</div>
          <div id="totalData" class="text-xl font-semibold text-blue-600">0</div>
        </div>

        <div class="border rounded p-3 text-center">
          <div class="text-xs font-semibold text-gray-500">PROSES</div>
          <div id="prosesData" class="text-xl font-semibold text-yellow-500">0</div>
        </div>

        <div class="border rounded p-3 text-center">
          <div class="text-xs font-semibold text-gray-500">SELESAI [Dari Seksi Survei dan Pemetaan]</div>
          <div id="selesaiData" class="text-xl font-semibold text-green-600">0</div>
        </div>

      </div>


      <div class="w-72 space-y-2">
        <div class="text-xs text-gray-500">Progress Penyelesaian</div>

        <div class="w-full bg-gray-200 rounded h-3 overflow-hidden">
          <div id="progressBar" class="bg-blue-600 h-full w-[0%]"></div>
        </div>

        <div id="progressText" class="text-xs text-right text-gray-500">0%</div>

        <button onclick="loadBebanPetugasUkur()"
          class="mt-2 w-full bg-blue-600 text-white px-5 py-1.5 rounded hover:bg-blue-700 transition text-xs">
          🔄 Refresh Data
        </button>
      </div>

    </div>

    <div class="flex justify-end mb-2">
      <button onclick="downloadExcelBebanUkur()"
        class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">
        Download Excel
      </button>
    </div>

    <div class="border rounded overflow-hidden">

      <div class="max-h-[360px] overflow-y-auto">
        <table class="w-full border-collapse text-xs">
          <thead class="bg-gray-100 sticky top-0">
            <tr>
              <th class="border px-3 py-2">Nomor Berkas</th>
              <th class="border px-3 py-2">Nama Pemohon</th>
              <th class="border px-3 py-2">Jenis Permohonan</th>
              <th class="border px-3 py-2">Desa / Kecamatan</th>
              <th class="border px-3 py-2">Petugas Ukur</th>
              <th class="border px-3 py-2">Posisi</th>
            </tr>
          </thead>

          <tbody id="tableBody">
            <tr>
              <td colspan="5" class="text-center py-6 text-gray-400">
                Memuat data...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

  </div>
</div>


<script src="../js/beban-petugas-ukur.js"></script>
