<div class="bg-white rounded-lg shadow" id="entry-data-berkas">

  <div class="px-6 py-3 border-b flex items-center gap-2">
    <img src="icons/edit-3.svg" class="w-4 h-4">
    <h2 class="text-sm font-semibold text-blue-600">
      Entry Data Berkas Baru
    </h2>
  </div>

  <form id="form-entry-berkas"
        class="px-6 py-6 text-sm text-gray-700 space-y-6">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

      <div class="space-y-4">
        <div>
          <label class="block font-semibold mb-1">Tanggal Mulai</label>
          <input type="date" id="tanggal_mulai"
                 class="w-full border rounded px-3 py-2">
        </div>

        <div>
          <label class="block font-semibold mb-1">Nomor Berkas</label>
          <input type="text" id="nomor_berkas"
                 class="w-full border rounded px-3 py-2">
        </div>

        <div>
          <label class="block font-semibold mb-1">Tahun</label>
          <input type="text" id="tahun"
                 placeholder="2025"
                 class="w-full border rounded px-3 py-2">
        </div>
      </div>


      <div class="space-y-4">
        <div>
          <label class="block font-semibold mb-1">Nama Pemohon</label>
          <input type="text" id="nama_pemohon"
                 class="w-full border rounded px-3 py-2">
        </div>


        <div class="relative">
          <label class="block font-semibold mb-1">Jenis Permohonan</label>
          <input type="text" id="jenis_permohonan" autocomplete="off"
                 class="w-full border rounded px-3 py-2">
          <ul id="jenis_permohonan_list"
              class="absolute z-20 bg-white border w-full mt-1
                     rounded shadow max-h-48 overflow-auto hidden"></ul>
        </div>


        <div class="relative">
          <label class="block font-semibold mb-1">Desa / Kecamatan</label>
          <input type="text" id="desa_kecamatan" autocomplete="off"
                 class="w-full border rounded px-3 py-2">
          <ul id="desa_kecamatan_list"
              class="absolute z-20 bg-white border w-full mt-1
                     rounded shadow max-h-48 overflow-auto hidden"></ul>
        </div>
      </div>

    </div>

    <div class="flex justify-end pt-4">
      <button type="submit"
              class="bg-green-600 text-white px-6 py-2 rounded">
        Simpan
      </button>
    </div>

  </form>
</div>

<script>

const DATA_JENIS_PERMOHONAN = [
  'Pendaftaran Tanah Pertama Kali',
  'Pengukuran Ulang dan Pemetaan Kadastral',
  'Pemisahan Bidang',
  'Penggabungan Bidang',
  'Perubahan Hak',
  'Balik Nama',
  'Pendaftaran SKPT'
];

const DATA_DESA_KECAMATAN = [
  'Desa Temulus',
  'Desa Ngliron',
  'Desa Kedungrejo',
  'Desa Karanganyar',
  'Kecamatan Sambong',
  'Kecamatan Kradenan'
];

function setupAutocomplete(inputId, listId, dataList) {
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);

  input.addEventListener('input', () => {
    const keyword = input.value.toLowerCase();
    list.innerHTML = '';

    if (!keyword) {
      list.classList.add('hidden');
      return;
    }

    const results = dataList.filter(item =>
      item.toLowerCase().includes(keyword)
    );

    if (results.length === 0) {
      list.classList.add('hidden');
      return;
    }

    results.forEach(item => {
      const li = document.createElement('li');
      li.textContent = item;
      li.className =
        'px-3 py-2 cursor-pointer hover:bg-blue-100';

      li.onclick = () => {
        input.value = item;
        list.classList.add('hidden');
      };

      list.appendChild(li);
    });

    list.classList.remove('hidden');
  });

  document.addEventListener('click', e => {
    if (!e.target.closest(`#${inputId}`)) {
      list.classList.add('hidden');
    }
  });
}

setupAutocomplete(
  'jenis_permohonan',
  'jenis_permohonan_list',
  DATA_JENIS_PERMOHONAN
);

setupAutocomplete(
  'desa_kecamatan',
  'desa_kecamatan_list',
  DATA_DESA_KECAMATAN
);


document.getElementById('form-entry-berkas')
  .addEventListener('submit', e => {
    e.preventDefault();
    alert('Form siap dikirim ke server 🚀');
  });
</script>
