<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Nur Wahyudhi Wibowo SP1 GK-->
  <meta charset="UTF-8">
  <title>Aplikasi Berkas+</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

 
  <link rel="icon" href="icons/ATR1.ico" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script> 
  <link rel="stylesheet" href="css/style.css">
  
  <script src="js/Core-0887hwequweasdnnu62377.js"></script>
  <script src="js/app-min.js"></script>
  <script src="js/distribusi-berkas.js"></script>
  <script src="js/qwyusajkhu1.js"></script>
  <script src="js/chart.umd.js"></script>
  <script src="js/xlsx.full.min.js"></script>
  <script src="js/ygkashkhuhhuashuhu2.js"></script>
  <script src="js/D88293jasd938jsad9u3244.js"></script>

</head>

<body class="h-screen overflow-hidden bg-gray-100">

<div class="flex h-full">

  <aside class="sidebar" id="sidebar">
    
    <div class="sidebar-header flex items-center gap-3">
      <img src="icons/ATR1(2).png" alt="ATR Logo" class="w-8 h-8 object-contain">
      <div class="leading-tight">
        <div class="sidebar-title">Kantor Pertanahan</div>
        <div class="sidebar-subtitle">KABUPATEN GUNUNGKIDUL</div>
      </div>
    </div>

    
    <nav class="sidebar-menu">

      
      <button class="menu active"
              data-tooltip="Dashboard"
              onclick="loadPage('dashboard.html')">
        <img src="icons/dashboard.svg">
        <span class="menu-text">Dashboard</span>
      </button>

      
      <div class="menu-group">
        <button class="menu has-submenu"
                data-tooltip="Berkas"
                onclick="toggleSubmenu(this)">
          <img src="icons/book-open.svg">
          <span class="menu-text">Berkas</span>
          <span class="submenu-arrow">❯</span>
        </button>

        <div class="submenu">
          <button class="submenu-item"
                  onclick="loadPage('informasi-berkas.html')">
            <img src="icons/info.svg">
            <span>Informasi Berkas</span>
          </button>

          <button class="submenu-item"
                  onclick="loadPage('distribusi-berkas.html')">
            <img src="icons/check-circle.svg">
            <span>Distribusi Berkas</span>
          </button>
        </div>
      </div>

      
      <div class="menu-group">
        <button class="menu has-submenu"
                data-tooltip="Aplikasi"
                onclick="toggleSubmenu(this)">
          <img src="icons/send.svg">
          <span class="menu-text">Aplikasi</span>
          <span class="submenu-arrow">❯</span>
        </button>

        <div class="submenu">
          <button
            class="submenu-item flex justify-between items-center"
            onclick="loadPage('inbox.html')">       
            <div class="flex items-center gap-2">
              <img src="icons/inbox.svg">
              <span>Inbox</span>
            </div>             
          </button>

          <button class="submenu-item"
                  onclick="loadPage('entry-data-berkas.html')">
            <img src="icons/edit.svg">
            <span>Entry Data Berkas</span>
          </button>
        
          <button class="submenu-item"
                  onclick="loadPage('kirim-berkas.html')">
            <img src="icons/send.svg">
            <span>Kirim Berkas</span>
          </button>

          <button class="submenu-item"
                  onclick="loadPage('history-berkas.html')">
            <img src="icons/history.svg">
            <span>History Berkas</span>
          </button>
        </div>
      </div>

      
      <div class="menu-group">
        <button class="menu has-submenu"
                data-tooltip="BerkasPlus"
                onclick="toggleSubmenu(this)">
          <img src="icons/link-2.svg">
          <span class="menu-text">BerkasPlus</span>
          <span class="submenu-arrow">❯</span>
        </button>

        <div class="submenu">
          <button class="submenu-item"
                  onclick="loadPage('beban-petugas.html')">
            <img src="icons/folder.svg">
            <span>Beban Petugas</span>
          </button>

          <button class="submenu-item"
                  onclick="loadPage('beban-petugas-ukur.html')">
            <img src="icons/folder-plus.svg">
            <span>Beban Petugas Ukur</span>
          </button>

          <button class="submenu-item"
                  onclick="loadPage('monitoring-petugas-ukur.html')">
            <img src="icons/monitor.svg">
            <span>Monitoring Petugas Ukur</span>
          </button>

        </div>
      </div>

      
      <div class="menu-group">
        <button class="menu has-submenu"
                data-tooltip="Ploting"
                onclick="toggleSubmenu(this)">
          <img src="icons/map.svg">
          <span class="menu-text">Plotting SiGundul</span>
          <span class="submenu-arrow">❯</span>
        </button>

        <div class="submenu">
          <button class="submenu-item"
                  onclick="loadPage('ploting.html')">
            <img src="icons/map-pin.svg">
            <span>Plotting</span>
          </button>

          <button class="submenu-item"
                  onclick="loadPage('daftar-ploting.html')">
            <img src="icons/layers.svg">
            <span>Data Plotting</span>
          </button>
        </div>
      </div>

      
      <div class="menu-group">
        <button class="menu has-submenu"
                data-tooltip="Tools"
                onclick="toggleSubmenu(this)">
          <img src="icons/tools.svg">
          <span class="menu-text">Tools</span>
          <span class="submenu-arrow">❯</span>
        </button>

        <div class="submenu">
          <button class="submenu-item"
                  onclick="loadPage('daftar-petugas.html')">
            <img src="icons/user.svg">
            <span>Daftar Petugas</span>
          </button>

          <button class="submenu-item"
                  onclick="loadPage('petugas-ukur.html')">
            <img src="icons/user-plus.svg">
            <span>Daftar Petugas Ukur</span>
          </button>

          <button class="submenu-item"
                  onclick="loadPage('jenis-permohonan.html')">
            <img src="icons/list.svg">
            <span>Jenis Permohonan</span>
          </button>

          <button class="submenu-item"
                  onclick="loadPage('daftar-berkas.html')">
            <img src="icons/upload.svg">
            <span>Daftar Berkas Upload</span>
          </button>
        </div>
      </div>

    </nav>
  </aside>

  
  <main class="flex-1 flex flex-col">

    
    <header class="topbar">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="toggle-btn">☰</button>
        <h1 id="page-title">Dashboard</h1>
      </div>

      <div class="flex items-center gap-4 text-sm">

        
        <div class="relative flex items-center gap-4">

          
          <div id="notifInbox"
              class="hidden overflow-hidden whitespace-nowrap max-w-md">
            <div id="notifText"
                class="inline-block text-sm text-red-600 font-semibold notif-marquee">
              📥 Inbox baru masuk
            </div>
          </div>

          
          <div class="relative cursor-pointer" onclick="loadPage('inbox.html')">

            <img src="icons/bell.svg" class="w-5 h-5"
                style="filter: invert(32%) sepia(87%) saturate(746%) hue-rotate(340deg);">

           
            <span id="notifBadge"
                  class="hidden absolute -top-2 -right-2
                        bg-red-600 text-white text-xs
                        px-2 py-0.5 rounded-full">
              0
            </span>
          </div>
        </div>
 
 
        <div class="relative" id="userDropdown">

          
          <button onclick="toggleUserMenu()"
                  class="flex items-center gap-2 px-3 py-2 rounded-md
                        hover:bg-gray-100 transition">
            <img src="icons/user.svg" class="w-4 h-4">
            <span id="user-name" class="text-sm">User</span>
            <svg class="w-3 h-3 text-gray-500" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>

       
          <div id="userMenu"
              class="hidden absolute right-0 mt-2 w-40
                      bg-white border rounded-md shadow-lg
                      text-sm z-50">

            <button onclick="logout()"
                    class="w-full px-4 py-2 text-left
                          text-red-600 hover:bg-red-50">
              ⎋ Log Out
            </button>

          </div>
        </div>
    </header>

    
    <section id="content" class="flex-1 p-6 overflow-y-auto"></section>

  </main>
</div>


<div
  id="globalLoading"
  class="fixed inset-0 z-[9999] hidden items-center justify-center
         bg-black/10"
>
  <div
    class="flex flex-col items-center gap-3 rounded-xl
           bg-white px-10 py-3 shadow-xl"
  >
    <svg
      class="h-4 w-4 animate-spin text-blue-600"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
    >
      <circle
        class="opacity-25"
        cx="12"
        cy="12"
        r="10"
        stroke="currentColor"
        stroke-width="4"
      ></circle>
      <path
        class="opacity-75"
        fill="currentColor"
        d="M4 12a8 8 0 018-8v4l3-3-3-3v4a8 8 0 00-8 8z"
      ></path>
    </svg>

    <span
      id="globalLoadingText"
      class="text-sm font-medium text-gray-700"
    >
      Memproses data...
    </span>
  </div>
</div>
<script src="js/L88293jasd938jsad9u323.js"></script>
</body>
</html>
