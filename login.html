<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login | BERKAS+</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="icons/ATR1.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js" defer></script>
</head>

<body class="login-page">

  <div class="login-card">
  
    <div class="flex items-center justify-center gap-3 mb-6">
      <img src="icons/ATR1(2).png" class="w-12 h-12">
      <div>
        <div class="font-semibold text-white">ATR/BPN</div>
        <div class="text-xs text-white">KANTAH GUNUNGKIDUL</div>
      </div>
    </div>
    <div
      id="error"
      class="hidden bg-red-100 text-red-700 text-sm px-4 py-2 rounded-lg mb-4">
    </div>

    <form onsubmit="login(event)" class="space-y-4">
      <div>
        <label class="text-sm text-white">Username</label>
        <input id="username" class="w-full border rounded-lg px-3 py-2 text-sm"
               placeholder="Masukkan username" required>
      </div>
  
      <div>
        <label class="text-sm text-white">Password</label>
        <input id="password" type="password"
               class="w-full border rounded-lg px-3 py-2 text-sm"
               placeholder="Masukkan password" required>
      </div>
  
      <button class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700">
        Masuk
      </button>
    </form>
  
    <p class="text-sm text-center mt-6 text-gray-200">
      Belum punya akun?
      <a href="register.html" class="text-black hover:underline">
        Daftar di sini
      </a>
    </p>
  
  </div>
  
  </body>
  
</html>
